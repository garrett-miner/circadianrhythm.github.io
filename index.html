<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Circadian Rhythm</title>
    <meta name="description" content="Circadian Rhythm — film, 3D motion and digital experiences. Chicago.">
    <meta property="og:title" content="Circadian Rhythm">
    <meta property="og:description" content="Film, 3D motion and digital experiences.">
    <meta property="og:type" content="website">
    <meta name="theme-color" content="#ffffff">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='white'/%3E%3Cpath d='M16 28.4C9 28.6 3.4 23 3.6 16 3.8 9.2 9.4 3.6 16.3 3.6' fill='none' stroke='black' stroke-width='1.8' stroke-linecap='round'/%3E%3Ccircle cx='16.3' cy='3.8' r='2.4' fill='%232340c8'/%3E%3C/svg%3E">
    <style>
        :root {
            --paper: #ffffff;
            --ink: #000000;
            --graphite: #8a8a8a;
            --pen: #2340c8;
            --times: 'Times New Roman', Times, 'Liberation Serif', serif;
            --gutter: clamp(1.25rem, 4vw, 3rem);
            --max: 1200px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }

        body {
            font-family: var(--times);
            font-size: 1.25rem;
            line-height: 1.4;
            background: var(--paper);
            color: var(--ink);
            overflow-x: clip;
        }

        /* Faint paper tooth */
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 50;
            opacity: 0.05;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='3' stitchTiles='stitch'/></filter><rect width='240' height='240' filter='url(%23n)'/></svg>");
        }

        a { color: inherit; }
        :focus-visible { outline: 2px dashed var(--pen); outline-offset: 6px; }

        .wrap { max-width: var(--max); margin: 0 auto; padding: 0 var(--gutter); }

        /* Ink strokes: one wobble filter makes vectors look hand-drawn */
        .ink { fill: none; stroke: var(--ink); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; filter: url(#rough); }
        .ink.thin { stroke-width: 1; }
        .ink.faint { stroke: var(--graphite); stroke-width: 0.8; }
        .email .ink { filter: none; }

        /* Draw-on: a wipe that reveals each line as if the pen is moving */
        .draw {
            clip-path: inset(-30px 100% -30px -30px);
            transition: clip-path var(--dur, 1.2s) cubic-bezier(0.6, 0.05, 0.3, 1) var(--delay, 0s);
        }
        .draw.on { clip-path: inset(-30px -30px -30px -30px); }

        /* Top nav */
        .site-header { padding-top: 1.5rem; }
        .nav-row {
            display: flex; justify-content: space-between; align-items: baseline;
            padding-bottom: 0.9rem;
        }
        .mark { font-style: italic; font-size: 1.3rem; text-decoration: none; }
        .site-header ul { list-style: none; display: flex; gap: clamp(1.25rem, 3vw, 2.5rem); }
        .site-header nav a { text-decoration: none; font-size: 1.2rem; }
        .site-header nav a:hover, .mark:hover { color: var(--pen); }
        .rule { display: block; width: 100%; height: 10px; overflow: visible; }
        .rule .ink { filter: none; }

        /* Hero: name + day-circle, closed off by one long line */
        .hero {
            min-height: calc(100svh - 9rem);
            display: grid;
            grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr);
            align-items: center;
            column-gap: clamp(2rem, 5vw, 5rem);
            padding-top: 2.5rem;
            padding-bottom: 3.5rem;
        }
        .divider {
            display: block;
            width: 100%;
            height: 14px;
            overflow: visible;
        }
        .divider .ink { filter: none; stroke-width: 1.3; }

        /* The three disciplines, one quiet row */
        .disciplines {
            list-style: none;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            gap: 0.75rem 2rem;
            padding-top: 1.5rem;
            font-size: clamp(1.5rem, 2.6vw, 2.1rem);
            line-height: 1.1;
        }
        .hero h1 {
            font-weight: 400;
            font-size: clamp(4rem, 11vw, 9.25rem);
            line-height: 0.86;
            letter-spacing: -0.04em;
        }
        .hero h1 span { display: block; }
        .hero h1 span + span { padding-left: 0.6em; }

        .arc {
            justify-self: center;
            width: min(100%, 31rem);
            aspect-ratio: 1;
        }
        .arc svg { width: 100%; height: 100%; overflow: visible; }
        .arc .day {
            /* user-space width so the dash length respects pathLength */
            vector-effect: none;
            stroke-width: 0.5;
            stroke-dasharray: 0 100;
            transition: stroke-dasharray 2.6s cubic-bezier(0.22, 0.9, 0.24, 1);
        }
        .arc .sun-g {
            transform-origin: 50px 50px;
            transform: rotate(var(--angle, 0deg));
            transition: transform 2.6s cubic-bezier(0.22, 0.9, 0.24, 1);
        }
        .arc.settled .day, .arc.settled .sun-g { transition: none; }

        /* Contact */
        .contact { padding-block: clamp(5rem, 14vw, 11rem) clamp(3rem, 8vw, 6rem); }
        .email {
            position: relative; display: inline-block;
            font-style: italic;
            font-size: clamp(1.9rem, 6.4vw, 4.8rem);
            line-height: 1.1; text-decoration: none;
            word-break: break-word;
        }
        .email svg { position: absolute; left: 0; bottom: -0.6rem; width: 100%; height: 1rem; overflow: visible; }
        .email:hover { color: var(--pen); }
        .email:hover .ink { stroke: var(--pen); }

        footer { padding: 0 0 2.5rem; color: var(--graphite); font-size: 1rem; }

        @media (max-width: 900px) {
            .hero { grid-template-columns: 1fr; min-height: auto; padding-top: 3rem; row-gap: 3rem; }
            .hero .arc { width: min(80%, 22rem); }
            .disciplines { flex-direction: column; }
        }
        @media (max-width: 520px) {
            .email { font-size: 6.6vw; word-break: normal; white-space: nowrap; }
            .hero h1 span + span { padding-left: 0.35em; }
        }
        @media (prefers-reduced-motion: reduce) {
            html { scroll-behavior: auto; }
            .arc .day, .arc .sun-g { transition: none; }
            .draw { clip-path: none; transition: none; }
        }
    </style>
</head>
<body>
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
        <filter id="rough" x="-10%" y="-10%" width="120%" height="120%">
            <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="7" result="t"/>
            <feDisplacementMap in="SourceGraphic" in2="t" scale="2.6" xChannelSelector="R" yChannelSelector="G"/>
        </filter>
        <filter id="rough-fine" x="-10%" y="-10%" width="120%" height="120%">
            <feTurbulence type="fractalNoise" baseFrequency="0.12" numOctaves="2" seed="3" result="t"/>
            <feDisplacementMap in="SourceGraphic" in2="t" scale="0.8" xChannelSelector="R" yChannelSelector="G"/>
        </filter>
    </svg>

    <header class="site-header wrap">
        <div class="nav-row">
            <a class="mark" href="#top">CR</a>
            <nav aria-label="Primary">
                <ul>
                    <li><a href="#work">Work</a></li>
                    <li><a href="#contact">Contact</a></li>
                </ul>
            </nav>
        </div>
        <svg class="rule draw" style="--dur:1s" viewBox="0 0 1000 10" preserveAspectRatio="none" aria-hidden="true"><path class="ink thin" d="M1 6 C 200 3, 420 8, 640 5 S 900 4, 999 6"/></svg>
    </header>

    <main>
        <section class="hero wrap" id="top">
            <h1><span>Circadian</span><span>Rhythm</span></h1>

            <div class="arc" id="arc" aria-hidden="true">
                <svg viewBox="0 0 100 100">
                    <!-- the whole day, faint and loose -->
                    <path class="ink faint" style="filter:url(#rough-fine)" d="M50 92 C 26.5 92.2, 7.8 73, 8 49.6 C 8.2 26.4, 27 7.8, 50.4 8 C 73.6 8.2, 92.2 27, 92 50.4 C 91.8 73.4, 73 92, 49 91.6"/>
                    <path class="ink faint" style="filter:url(#rough-fine)" d="M51 94 C 25 94.4, 5.6 74, 6.1 49 C 6.6 25, 26 5.8, 50 6.2"/>
                    <!-- the part of today that has passed, starting at midnight (bottom) -->
                    <circle class="ink day" id="day" style="filter:url(#rough-fine)" cx="50" cy="50" r="42" pathLength="100" transform="rotate(90 50 50)"/>
                    <g class="sun-g">
                        <circle cx="50" cy="92" r="2.2" fill="#2340c8"/>
                    </g>
                </svg>
            </div>
        </section>

        <section class="work wrap" id="work">
            <svg class="divider draw" style="--dur:1.8s;--delay:0.35s" viewBox="0 0 1000 14" preserveAspectRatio="none" aria-hidden="true"><path class="ink" d="M0 7 C 120 5.5, 260 8.5, 420 6.8 S 700 5.2, 860 7.6 S 960 7, 1000 6.4"/></svg>
            <ul class="disciplines draw" style="--dur:1.6s;--delay:1.2s" aria-label="Disciplines">
                <li>Film</li>
                <li>3D motion</li>
                <li>Digital experiences</li>
            </ul>
        </section>

        <section class="contact wrap" id="contact">
            <a class="email" href="mailto:contact@circadianrhythm.studio">contact@circadianrhythm.studio<svg viewBox="0 0 600 16" preserveAspectRatio="none" aria-hidden="true"><path class="ink" d="M3 9 C 120 4, 260 12, 400 7 S 560 5, 597 9 M20 13 C 160 10, 330 14, 520 11"/></svg></a>
        </section>
    </main>

    <footer class="wrap">&copy; <span id="year">2026</span></footer>

    <script>
        {
            const arc = document.getElementById('arc');
            const day = document.getElementById('day');

            function dayFraction() {
                const parts = new Intl.DateTimeFormat('en-US', {
                    timeZone: 'America/Chicago', hour: 'numeric', minute: '2-digit', hourCycle: 'h23'
                }).formatToParts(new Date());
                const o = {};
                parts.forEach(p => { o[p.type] = p.value; });
                return ((parseInt(o.hour, 10) % 24) + parseInt(o.minute, 10) / 60) / 24;
            }

            function render() {
                const f = dayFraction();
                day.style.strokeDasharray = (f * 100) + ' 100';
                arc.style.setProperty('--angle', (f * 360) + 'deg');
            }

            // Load sequence: nav rule, the day arc tracing in, then the divider and the three words
            requestAnimationFrame(() => requestAnimationFrame(() => {
                render();
                document.querySelectorAll('.site-header .draw').forEach(el => el.classList.add('on'));
            }));
            const work = document.getElementById('work');
            const reveal = () => work.querySelectorAll('.draw').forEach(el => el.classList.add('on'));
            if ('IntersectionObserver' in window) {
                const workObserver = new IntersectionObserver(entries => {
                    if (entries.some(e => e.isIntersecting)) { reveal(); workObserver.disconnect(); }
                }, { threshold: 0.2 });
                workObserver.observe(work);
            } else { reveal(); }
            setTimeout(() => arc.classList.add('settled'), 2800);
            setInterval(render, 60000);

            document.getElementById('year').textContent = new Date().getFullYear();
        }
    </script>
</body>
</html>
