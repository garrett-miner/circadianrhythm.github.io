<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Circadian Rhythm</title>
    <meta name="description" content="Circadian Rhythm — film, 3D motion and digital experiences. Chicago.">
    <meta property="og:title" content="Circadian Rhythm">
    <meta property="og:description" content="Film, 3D motion and digital experiences.">
    <meta property="og:type" content="website">
    <meta name="theme-color" content="#ffffff">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='white'/%3E%3Cpath d='M16 28.4C9 28.6 3.4 23 3.6 16 3.8 9.2 9.4 3.6 16.3 3.6' fill='none' stroke='black' stroke-width='1.8' stroke-linecap='round'/%3E%3Ccircle cx='16.3' cy='3.8' r='2.4' fill='%232340c8'/%3E%3C/svg%3E">
    <style>
        :root {
            --paper: #ffffff;
            --ink: #000000;
            --graphite: #8a8a8a;
            --pen: #2340c8;
            --times: 'Times New Roman', Times, 'Liberation Serif', serif;
            --gutter: clamp(1.25rem, 4vw, 3rem);
            --max: 1200px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }

        body {
            font-family: var(--times);
            font-size: 1.25rem;
            line-height: 1.4;
            background: var(--paper);
            color: var(--ink);
            overflow-x: clip;
        }

        /* Faint paper tooth */
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 50;
            opacity: 0.05;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='3' stitchTiles='stitch'/></filter><rect width='240' height='240' filter='url(%23n)'/></svg>");
        }

        a { color: inherit; }
        :focus-visible { outline: 2px dashed var(--pen); outline-offset: 6px; }

        .wrap { max-width: var(--max); margin: 0 auto; padding: 0 var(--gutter); }

        /* Ink strokes: one wobble filter makes vectors look hand-drawn */
        .ink { fill: none; stroke: var(--ink); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; filter: url(#rough); }
        .ink.thin { stroke-width: 1; }
        .ink.faint { stroke: var(--graphite); stroke-width: 0.8; }
        .email .ink { filter: none; }

        /* Draw-on: a wipe that reveals each line as if the pen is moving */
        .draw {
            clip-path: inset(-30px 100% -30px -30px);
            transition: clip-path var(--dur, 1.2s) cubic-bezier(0.6, 0.05, 0.3, 1) var(--delay, 0s);
        }
        .draw.on { clip-path: inset(-30px -30px -30px -30px); }

        /* Top nav */
        .site-header { padding-top: 1.5rem; }
        .nav-row {
            display: flex; justify-content: space-between; align-items: baseline;
            padding-bottom: 0.9rem;
        }
        .mark { font-style: italic; font-size: 1.3rem; text-decoration: none; }
        .site-header ul { list-style: none; display: flex; gap: clamp(1.25rem, 3vw, 2.5rem); }
        .site-header nav a { text-decoration: none; font-size: 1.2rem; }
        .site-header nav a:hover, .mark:hover { color: var(--pen); }
        .rule { display: block; width: 100%; height: 10px; overflow: visible; }
        .rule .ink { filter: none; }

        /* Hero: name sits on a horizon line that runs through the day-circle */
        .hero {
            position: relative;
            min-height: calc(100svh - 4.5rem);
            display: grid;
            grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr);
            grid-template-rows: 1fr 1fr;
            column-gap: clamp(2rem, 5vw, 5rem);
            padding-top: 2rem;
            padding-bottom: 2rem;
        }
        .hero h1 { grid-row: 1; grid-column: 1; align-self: end; transform: translateY(var(--sink, 0.06em)); position: relative; z-index: 2; }
        .hero .arc { grid-row: 1 / 3; grid-column: 2; align-self: center; position: relative; z-index: 2; }
        .horizon {
            position: absolute;
            top: 50%;
            left: calc(50% - 50vw);
            width: 100vw;
            height: 14px;
            margin-top: -7px;
            overflow: visible;
            z-index: 1;
        }
        .horizon .ink { filter: none; stroke-width: 1.3; }
        .hero h1 {
            font-weight: 400;
            font-size: clamp(4rem, 11vw, 9.25rem);
            line-height: 0.86;
            letter-spacing: -0.04em;
        }
        .hero h1 span { display: block; }
        .hero h1 span + span { padding-left: 0.6em; }

        .arc {
            justify-self: center;
            width: min(100%, 31rem);
            aspect-ratio: 1;
        }
        .arc svg { width: 100%; height: 100%; overflow: visible; }
        .arc .day {
            /* user-space width so the dash length respects pathLength */
            vector-effect: none;
            stroke-width: 0.5;
            stroke-dasharray: 0 100;
            transition: stroke-dasharray 2.6s cubic-bezier(0.22, 0.9, 0.24, 1);
        }
        .arc .sun-g {
            transform-origin: 50px 50px;
            transform: rotate(var(--angle, 0deg));
            transition: transform 2.6s cubic-bezier(0.22, 0.9, 0.24, 1);
        }
        .arc.settled .day, .arc.settled .sun-g { transition: none; }

        /* Work: three sketched frames, one word each */
        .work { padding-block: clamp(3rem, 8vw, 7rem); }
        .frames {
            list-style: none;
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: clamp(1.5rem, 3vw, 2.75rem);
        }
        .frame:nth-child(1) { transform: rotate(-0.8deg); }
        .frame:nth-child(2) { transform: rotate(0.6deg) translateY(1.5rem); }
        .frame:nth-child(3) { transform: rotate(-0.4deg); }
        .sketch { position: relative; aspect-ratio: 4 / 5; display: grid; place-items: center; }
        .sketch > svg:first-child { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
        .sketch .drawing { position: relative; width: 44%; height: auto; overflow: visible; }
        .frame h2 {
            font-weight: 400;
            font-size: clamp(1.6rem, 2.4vw, 2rem);
            line-height: 1.1;
            padding-top: 0.9rem;
        }

        /* Contact */
        .contact { padding-block: clamp(5rem, 14vw, 11rem) clamp(3rem, 8vw, 6rem); }
        .email {
            position: relative; display: inline-block;
            font-style: italic;
            font-size: clamp(1.9rem, 6.4vw, 4.8rem);
            line-height: 1.1; text-decoration: none;
            word-break: break-word;
        }
        .email svg { position: absolute; left: 0; bottom: -0.6rem; width: 100%; height: 1rem; overflow: visible; }
        .email:hover { color: var(--pen); }
        .email:hover .ink { stroke: var(--pen); }

        footer { padding: 0 0 2.5rem; color: var(--graphite); font-size: 1rem; }

        @media (max-width: 900px) {
            .hero { grid-template-columns: 1fr; grid-template-rows: auto auto; min-height: auto; padding-top: 3rem; row-gap: 3.5rem; }
            .hero .arc { grid-row: 2; grid-column: 1; width: min(80%, 22rem); }
            .horizon { top: var(--horizon-top, 40%); }
            .frames { grid-template-columns: 1fr; gap: 3rem; max-width: 26rem; }
            .frame:nth-child(2) { transform: rotate(0.6deg); }
            .sketch { aspect-ratio: 4 / 3; }
        }
        @media (max-width: 520px) {
            .hero h1 span + span { padding-left: 0.35em; }
        }
        @media (prefers-reduced-motion: reduce) {
            html { scroll-behavior: auto; }
            .arc .day, .arc .sun-g { transition: none; }
            .draw { clip-path: none; transition: none; }
        }
    </style>
</head>
<body>
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
        <filter id="rough" x="-10%" y="-10%" width="120%" height="120%">
            <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="7" result="t"/>
            <feDisplacementMap in="SourceGraphic" in2="t" scale="2.6" xChannelSelector="R" yChannelSelector="G"/>
        </filter>
        <filter id="rough-fine" x="-10%" y="-10%" width="120%" height="120%">
            <feTurbulence type="fractalNoise" baseFrequency="0.12" numOctaves="2" seed="3" result="t"/>
            <feDisplacementMap in="SourceGraphic" in2="t" scale="0.8" xChannelSelector="R" yChannelSelector="G"/>
        </filter>
    </svg>

    <header class="site-header wrap">
        <div class="nav-row">
            <a class="mark" href="#top">CR</a>
            <nav aria-label="Primary">
                <ul>
                    <li><a href="#work">Work</a></li>
                    <li><a href="#contact">Contact</a></li>
                </ul>
            </nav>
        </div>
        <svg class="rule draw" style="--dur:1s" viewBox="0 0 1000 10" preserveAspectRatio="none" aria-hidden="true"><path class="ink thin" d="M1 6 C 200 3, 420 8, 640 5 S 900 4, 999 6"/></svg>
    </header>

    <main>
        <section class="hero wrap" id="top">
            <svg class="horizon draw" id="horizon" style="--dur:1.8s;--delay:0.35s" viewBox="0 0 1000 14" preserveAspectRatio="none" aria-hidden="true"><path class="ink" d="M0 7 C 120 5.5, 260 8.5, 420 6.8 S 700 5.2, 860 7.6 S 960 7, 1000 6.4"/></svg>
            <h1><span>Circadian</span><span>Rhythm</span></h1>

            <div class="arc" id="arc" aria-hidden="true">
                <svg viewBox="0 0 100 100">
                    <!-- the whole day, faint and loose -->
                    <path class="ink faint" style="filter:url(#rough-fine)" d="M50 92 C 26.5 92.2, 7.8 73, 8 49.6 C 8.2 26.4, 27 7.8, 50.4 8 C 73.6 8.2, 92.2 27, 92 50.4 C 91.8 73.4, 73 92, 49 91.6"/>
                    <path class="ink faint" style="filter:url(#rough-fine)" d="M51 94 C 25 94.4, 5.6 74, 6.1 49 C 6.6 25, 26 5.8, 50 6.2"/>
                    <!-- the part of today that has passed, starting at midnight (bottom) -->
                    <circle class="ink day" id="day" style="filter:url(#rough-fine)" cx="50" cy="50" r="42" pathLength="100" transform="rotate(90 50 50)"/>
                    <g class="sun-g">
                        <circle cx="50" cy="92" r="2.2" fill="#2340c8"/>
                    </g>
                </svg>
            </div>
        </section>

        <section class="work wrap" id="work">
            <ul class="frames">
                <li class="frame">
                    <div class="sketch draw" aria-hidden="true">
                        <svg viewBox="0 0 400 500" preserveAspectRatio="none"><path class="ink" d="M6 8 L 394 5 L 396 492 L 4 495 Z M2 12 L 9 2"/></svg>
                        <svg class="drawing draw" style="--delay:0.5s;--dur:1.4s" viewBox="0 0 120 90"><path class="ink" d="M10 26 C 10 22, 12 20, 16 20 L 36 20 L 44 9 L 76 9 L 84 20 L 104 20 C 108 20, 110 22, 110 26 L 110 78 C 110 82, 108 84, 104 84 L 16 84 C 12 84, 10 82, 10 78 Z"/><path class="ink" d="M60 33 C 74 32, 81 42, 80 52 C 79 63, 70 70, 59.5 70 C 48 69.5, 40 61, 40.5 51 C 41 41, 49 33, 62 34"/><path class="ink thin" d="M60 42 C 66 42, 70 46, 70 51 C 70 57, 65 61, 60 61 C 54 61, 50 56, 50 51 C 50 46, 54 42, 61 42.5"/></svg>
                    </div>
                    <h2>Film</h2>
                </li>
                <li class="frame">
                    <div class="sketch draw" aria-hidden="true">
                        <svg viewBox="0 0 400 500" preserveAspectRatio="none"><path class="ink" d="M4 5 L 395 8 L 393 496 L 7 493 Z M398 2 L 390 11"/></svg>
                        <svg class="drawing draw" style="--delay:0.5s;--dur:1.4s" viewBox="0 0 120 90"><path class="ink" d="M60 6 L 98 24 L 98 66 L 60 85 L 22 66 L 22 24 Z"/><path class="ink" d="M22 24 L 60 43 L 98 24 M60 43 L 60 85"/><path class="ink thin" d="M60 6 L 60 22 M41 15 L 79 33" stroke-dasharray="2 3"/></svg>
                    </div>
                    <h2>3D motion</h2>
                </li>
                <li class="frame">
                    <div class="sketch draw" aria-hidden="true">
                        <svg viewBox="0 0 400 500" preserveAspectRatio="none"><path class="ink" d="M7 4 L 396 7 L 393 494 L 5 496 Z M1 490 L 10 499"/></svg>
                        <svg class="drawing draw" style="--delay:0.5s;--dur:1.4s" viewBox="0 0 120 90"><path class="ink" d="M8 8 L 112 7 L 111 66 L 9 67 Z"/><path class="ink" d="M60 67 L 60 80 M40 82 L 80 81"/><path class="ink thin" d="M20 22 L 58 21 M20 32 L 84 32 M20 42 L 70 41 M20 52 L 46 52"/></svg>
                    </div>
                    <h2>Digital experiences</h2>
                </li>
            </ul>
        </section>

        <section class="contact wrap" id="contact">
            <a class="email" href="mailto:contact@circadianrhythm.studio">contact@circadianrhythm.studio<svg viewBox="0 0 600 16" preserveAspectRatio="none" aria-hidden="true"><path class="ink" d="M3 9 C 120 4, 260 12, 400 7 S 560 5, 597 9 M20 13 C 160 10, 330 14, 520 11"/></svg></a>
        </section>
    </main>

    <footer class="wrap">&copy; <span id="year">2026</span></footer>

    <script>
        {
            const arc = document.getElementById('arc');
            const day = document.getElementById('day');

            function dayFraction() {
                const parts = new Intl.DateTimeFormat('en-US', {
                    timeZone: 'America/Chicago', hour: 'numeric', minute: '2-digit', hourCycle: 'h23'
                }).formatToParts(new Date());
                const o = {};
                parts.forEach(p => { o[p.type] = p.value; });
                return ((parseInt(o.hour, 10) % 24) + parseInt(o.minute, 10) / 60) / 24;
            }

            function render() {
                const f = dayFraction();
                day.style.strokeDasharray = (f * 100) + ' 100';
                arc.style.setProperty('--angle', (f * 360) + 'deg');
            }

            // Load sequence: nav rule, then horizon, while the day arc draws itself in
            requestAnimationFrame(() => requestAnimationFrame(() => {
                render();
                document.querySelectorAll('.site-header .draw, .hero .draw').forEach(el => el.classList.add('on'));
            }));

            // Frames sketch themselves in as they come into view
            const frames = document.querySelectorAll('.frame');
            if ('IntersectionObserver' in window) {
                const frameObserver = new IntersectionObserver(entries => {
                    entries.forEach(e => {
                        if (!e.isIntersecting) return;
                        const i = [...frames].indexOf(e.target);
                        e.target.querySelectorAll('.draw').forEach(d => {
                            d.style.setProperty('--delay', (i * 0.18 + (d.classList.contains('drawing') ? 0.55 : 0)) + 's');
                            d.classList.add('on');
                        });
                        frameObserver.unobserve(e.target);
                    });
                }, { threshold: 0.25 });
                frames.forEach(f => frameObserver.observe(f));
            } else {
                document.querySelectorAll('.frame .draw').forEach(d => d.classList.add('on'));
            }

            // On narrow screens, keep the horizon tucked under the name
            const hero = document.querySelector('.hero');
            const h1 = hero.querySelector('h1');
            function placeHorizon() {
                if (window.matchMedia('(max-width: 900px)').matches) {
                    const top = h1.offsetTop + h1.offsetHeight + 4;
                    hero.style.setProperty('--horizon-top', top + 'px');
                }
            }
            placeHorizon();
            window.addEventListener('resize', placeHorizon);
            setTimeout(() => arc.classList.add('settled'), 2800);
            setInterval(render, 60000);

            document.getElementById('year').textContent = new Date().getFullYear();
        }
    </script>
</body>
</html>
